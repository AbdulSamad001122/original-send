name: Build BrotherSend Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrotherSend-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Required by CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Bundle VC Runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Package Windows ZIP
        run: |
          Compress-Archive -Path "app\build\windows\x64\runner\Release\*" -DestinationPath "BrotherSend-Windows-Portable.zip"

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrotherSend-Windows-Portable
          path: BrotherSend-Windows-Portable.zip

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Install Cargokit Dependencies
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Package macOS DMG & ZIP
        run: |
          # Package ZIP preserving symlinks and macOS metadata
          ditto -c -k --sequesterRsrc --keepParent "app/build/macos/Build/Products/Release/LocalSend.app" "BrotherSend-macOS.zip"
          
          # Prepare staging folder for DMG with Applications symlink
          mkdir -p dmg_staging
          cp -R "app/build/macos/Build/Products/Release/LocalSend.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "BrotherSend" -srcfolder dmg_staging -ov -format UDZO "BrotherSend-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrotherSend-macOS-DMG
          path: BrotherSend-macOS.dmg

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrotherSend-macOS-ZIP
          path: BrotherSend-macOS.zip

  release:
    name: Publish Public GitHub Release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_assets
          cp artifacts/BrotherSend-Android-APK/app-release.apk release_assets/BrotherSend-Android.apk
          cp artifacts/BrotherSend-Windows-Portable/BrotherSend-Windows-Portable.zip release_assets/BrotherSend-Windows.zip
          cp artifacts/BrotherSend-macOS-DMG/BrotherSend-macOS.dmg release_assets/BrotherSend-macOS.dmg
          cp artifacts/BrotherSend-macOS-ZIP/BrotherSend-macOS.zip release_assets/BrotherSend-macOS.zip
          ls -la release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "BrotherSend v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## BrotherSend Binaries (Direct Download - No Login Required)

            Click any direct link below to download BrotherSend directly without signing in:

            * 📱 **Android**: [BrotherSend-Android.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BrotherSend-Android.apk)
            * 💻 **Windows**: [BrotherSend-Windows.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BrotherSend-Windows.zip) (Portable)
            * 🍏 **macOS (DMG)**: [BrotherSend-macOS.dmg](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BrotherSend-macOS.dmg) (Installer)
            * 🍏 **macOS (ZIP)**: [BrotherSend-macOS.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BrotherSend-macOS.zip) (Archive)
          files: release_assets/*


